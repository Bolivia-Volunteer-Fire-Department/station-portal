<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons: department patch. Absolute paths are fine here because Vite
         rewrites them to the deployed base path at build time (unlike files in
         public/, which are copied verbatim - see manifest.webmanifest). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/icon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icons/icon-512x512.png" type="image/png" sizes="512x512" />

    <!-- Web app manifest. `display: standalone` is what makes iOS treat this as
         an installable web app - a hard requirement before iOS will deliver
         push notifications to it. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores manifest icons, so the Home Screen icon comes from here
         (152px for older iPads, 180px for current devices). -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <meta name="theme-color" content="#0A2A5B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BFD Station Portal" />

    <title>BFD Station Portal</title>

    <!-- iOS launch images for the installed web app. iOS picks the one matching
         the device's screen and orientation; the navy background matches the
         manifest background_color so the launch is seamless. -->

    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="/splash/splash-2796x1290.png" />
    <!-- iPhone 16 Pro / 15 -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="/splash/splash-2556x1179.png" />
