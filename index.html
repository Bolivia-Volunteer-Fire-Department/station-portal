<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The viewport is the app's, not the page's.
    //
    // `viewport-fit=cover` is what lets the layout reach the sides of a notched phone and extend under
    // the status bar and the home indicator; the shell then keeps its own content clear of them with
    // env(safe-area-inset-*) (see App.jsx, Sidebar.jsx and the notes in index.css). Without it iOS
    // letterboxes the app inside the safe area - which is the "installed, but it does not fill the
    // screen" look, and no amount of CSS fixes it from there.
    //
    // Pinch-zoom is deliberately still ALLOWED here. It is how a low-vision member reads a schedule or
    // a document, and it costs nothing in a browser tab. The double-tap zoom is taken out by
    // `touch-action: manipulation` (index.css) instead, which is the half that actually gets in the
    // way. An INSTALLED window closes the door on pinch as well - see src/utils/nativeShell.js, which
    // rewrites this meta only when the app is not in a tab. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons: department patch. Absolute paths are fine here because Vite
         rewrites them to the deployed base path at build time (unlike files in
         public/, which are copied verbatim - see manifest.webmanifest). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/icon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icons/icon-512x512.png" type="image/png" sizes="512x512" />

    <!-- Web app manifest. `display: standalone` is what makes iOS treat this as
         an installable web app - a hard requirement before iOS will deliver
         push notifications to it. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores manifest icons, so the Home Screen icon comes from here
         (152px for older iPads, 180px for current devices). -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <meta name="theme-color" content="#0A2A5B" />
    <!-- Standalone display, declared twice on purpose: iOS Safari only honors the apple-prefixed name, and Chrome
         only honors the standard one - and says so in the console ("apple-mobile-web-app-capable is deprecated")
         when it finds the prefixed name alone. Browsers that read neither use the manifest's `display: standalone`,
         which is the modern declaration and is what actually installs the app on Android. Keep the pair together.

         `display: standalone` in the manifest is also what iOS requires before it will deliver push notifications
         to an installed app, so it is NOT the value to change when the window should be fuller: the manifest's
         `display_override` asks for `fullscreen` first (no status or navigation bar at all on Android), and iOS
         ignores `display_override` entirely and keeps reading `display`. Changing that one line would trade the
         whole notification feature for a taller window. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` paints an installed app UNDER the status bar, so the area behind the clock is
         ours instead of a separate grey band - most of the difference between an app and a page in a frame.

         It is a STATIC value on purpose, and that is a finding, not an oversight. iOS caches this meta
         when the app is added to the Home Screen and ignores later changes - including a fresh value
         served on reload, and the same value set by JavaScript (reported consistently on Apple's developer
         forum and on Stack Overflow, in both cases by people trying to switch it with a dark-mode toggle,
         which is exactly what this would have been). The only thing that updates it is removing the Home
         Screen icon and adding it again.

         So it cannot follow the theme, and instead the theme cannot matter: iOS draws this bar's clock and
         icons WHITE whatever is behind them, and the shell paints a navy strip under them in both themes
         (App.jsx). That navy is the same one the manifest and theme-color declare.

         A tab is unaffected: this meta is only read by an installed iOS web app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BFD Station Portal" />

    <title>BFD Station Portal</title>
