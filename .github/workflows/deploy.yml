name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The station is ON Firebase now, and the sheet is no longer a backend: a build without this config is a build
      # where nobody can sign in. So this refuses to publish one - the check the Apps Script URL used to have, moved to
      # the thing that is actually required.
      - name: Verify the Firebase web config is set
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          for pair in "VITE_FIREBASE_API_KEY:$API_KEY" "VITE_FIREBASE_AUTH_DOMAIN:$AUTH_DOMAIN" "VITE_FIREBASE_PROJECT_ID:$PROJECT_ID" "VITE_FIREBASE_APP_ID:$APP_ID"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          echo "The Firebase web config is set."

      - name: Install dependencies
        run: npm ci

      # A credential in the tree is the one mistake that cannot be undone by a later commit: the commit stays
      # reachable by SHA and every clone keeps its copy. This fails the build before it can be published.
      - name: Guard against committed credentials
        run: python3 scripts/check-secrets.py

      # Lint before building. It is fast and deterministic, and it catches the class of mistake a build
      # cannot: an undefined identifier in an expression (a missing destructured prop) compiles fine and
      # throws at runtime. The behavioral suite is run locally - see "Before you publish" in the README -
      # because several of its assertions depend on the current date.
      - name: Lint
        run: npm run lint

      # The cost model and the structural invariants, guarded where they can be REPRODUCED: these read source and fixed
      # fixtures with no dependence on the current date, so a regression in WHO reads WHAT - or in the training counter -
      # fails the build rather than the bill. (The render harnesses stay local: several of their assertions are relative
      # to today, per the README's note on the suite.)
      - name: Guard the read budget and the training counter
        run: npm run verify:read-budget && npm run verify:training && npm run verify:push-audience && npm run verify:forms

      - name: Build
        # The Firebase values are the web app's PUBLIC config, passed through as repository secrets because a CI build
        # has no .env (it is gitignored). There is no VITE_APPS_SCRIPT_URL any more: the sheet is not a backend and
        # nothing reads the value, and the check above is what makes a missing config a failed build rather than a
        # published app that nobody can sign in to.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # Which routes are on. Unset means every route whose prerequisites are met, which is the normal state;
          # `off`/`none` is a kill switch, and it is only a kill switch - there is no second backend to fall back to
          # now, so switching a route off means the screens that use it fail. See src/services/firestoreRouting.js.
          VITE_FIRESTORE_FEATURES: ${{ secrets.VITE_FIRESTORE_FEATURES }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building with base path /${REPO_NAME}/"
          BASE_PATH="/${REPO_NAME}/" npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4